<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Status</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 45%, #fff7ed 100%);
      color: #111827;
    }

    .container {
      max-width: 860px;
      margin: 80px auto;
      padding: 25px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      color: #6b7280;
    }

    input, textarea, select, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      background: #0f766e;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #115e59;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-grid input,
    .form-grid select {
      margin-top: 0;
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      background: #ecfeff;
      display: none;
    }

    .status {
      font-weight: bold;
      color: #0f766e;
      font-size: 20px;
    }

    .admin-link {
      text-align: center;
      margin-top: 40px;
      color: #6b7280;
      cursor: pointer;
      font-size: 14px;
    }

    #adminPanel {
      display: none;
      margin-top: 30px;
      border-top: 1px solid #e5e7eb;
      padding-top: 25px;
    }

    .small {
      font-size: 13px;
      color: #6b7280;
      text-align: left;
    }

    .version {
      margin-top: 10px;
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
    }

    .submitted-orders {
      display: none;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #e5e7eb;
    }

    .submitted-orders h3 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .orders-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 14px;
    }

    .orders-table th,
    .orders-table td {
      padding: 10px;
      border: 1px solid #e5e7eb;
      text-align: left;
      vertical-align: top;
    }

    .orders-table th {
      background: #f9fafb;
      color: #374151;
    }

    .shipment-card {
      margin-top: 14px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
      background: #ffffff;
    }

    .shipment-card summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px;
      cursor: pointer;
      background: #f8fafc;
      font-weight: 700;
    }

    .shipment-meta {
      color: #6b7280;
      font-size: 13px;
      font-weight: 400;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .status-processing {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status-delayed {
      background: #fee2e2;
      color: #b91c1c;
    }

    .status-bd-custom {
      background: #fef3c7;
      color: #92400e;
    }

    .status-delivered {
      background: #dcfce7;
      color: #15803d;
    }

    .status-default {
      background: #f3f4f6;
      color: #374151;
    }

    .message-cell {
      color: #4b5563;
      line-height: 1.4;
    }

    .updated-cell {
      color: #6b7280;
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      .container {
        margin: 24px 12px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .orders-table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Check Your Order Status</h1>
    <p>Enter your phone number to see the latest update</p>

    <input type="text" id="searchPhone" placeholder="Enter phone number" />
    <button onclick="searchOrder()">Search</button>

    <div class="result" id="resultBox"></div>

    <div class="admin-link" onclick="showAdmin()">Admin</div>

    <div id="adminPanel">
      <h2>Admin Panel</h2>

      <input type="text" id="adminUsername" placeholder="Admin username" autocomplete="username" />
      <input type="password" id="adminPassword" placeholder="Admin password" />
      <button onclick="adminLogin()">Login</button>
      <div class="version">Admin login v2</div>

      <div id="adminForm" style="display:none;">
        <p class="small">Choose an existing shipment to update all its phones, or type a new shipment name and add phone numbers.</p>

        <div class="form-grid">
          <select id="shipmentSelect" onchange="selectShipment()">
            <option value="">New shipment</option>
          </select>

          <input type="text" id="shipmentName" placeholder="Shipment name" />
        </div>

        <textarea id="bulkPhones" rows="7" placeholder="017xxxxxxxx&#10;018xxxxxxxx&#10;019xxxxxxxx"></textarea>

        <select id="status">
          <option value="Processing">Processing</option>
          <option value="Delayed">Delayed</option>
          <option value="BD Custom">BD Custom</option>
          <option value="Delivered">Delivered</option>
        </select>

        <textarea id="message" rows="4" placeholder="Write status message here"></textarea>

        <button onclick="saveStatus()">Submit / Update</button>

        <div id="submittedOrders" class="submitted-orders"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://qisjoiwrpeejhjjwgajo.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_nIrPT8RaYL4ZFeuar9jfrw__Qxl3HQ2";
    const ADMIN_USERS = {
      admin: "admin@order-status.local"
    };
    const APP_VERSION = "shipment-admin-v1";
    let savedOrders = [];

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    console.log(APP_VERSION);

    function cleanPhone(phone) {
      return phone.replace(/\D/g, "");
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getShipmentName(row) {
      return row.shipment_name || "No shipment";
    }

    function getStatusClass(status) {
      const key = String(status || "").toLowerCase().replace(/\s+/g, "-");
      if (key === "processing") return "status-processing";
      if (key === "delayed") return "status-delayed";
      if (key === "bd-custom") return "status-bd-custom";
      if (key === "delivered") return "status-delivered";
      return "status-default";
    }

    function renderStatusBadge(status) {
      return `<span class="status-badge ${getStatusClass(status)}">${escapeHtml(status)}</span>`;
    }

    function groupByShipment(rows) {
      return rows.reduce((groups, row) => {
        const shipment = getShipmentName(row);
        if (!groups[shipment]) groups[shipment] = [];
        groups[shipment].push(row);
        return groups;
      }, {});
    }

    function updateShipmentSelect(rows) {
      const shipmentSelect = document.getElementById("shipmentSelect");
      const currentValue = shipmentSelect.value;
      const shipments = [...new Set(rows.map(getShipmentName))]
        .filter(name => name !== "No shipment")
        .sort((a, b) => a.localeCompare(b));

      shipmentSelect.innerHTML = `
        <option value="">New shipment</option>
        ${shipments.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join("")}
      `;

      if (shipments.includes(currentValue)) {
        shipmentSelect.value = currentValue;
      }
    }

    function selectShipment() {
      const shipmentSelect = document.getElementById("shipmentSelect");
      document.getElementById("shipmentName").value = shipmentSelect.value;
      document.getElementById("bulkPhones").placeholder = shipmentSelect.value
        ? "Leave empty to update all phone numbers in this shipment"
        : "017xxxxxxxx\n018xxxxxxxx\n019xxxxxxxx";
    }

    function showSubmittedOrders(rows, summaryText = "") {
      const submittedOrders = document.getElementById("submittedOrders");
      const summary = summaryText || `Showing ${rows.length} saved order status update${rows.length === 1 ? "" : "s"}.`;
      const groups = groupByShipment(rows);
      const shipments = Object.keys(groups).sort((a, b) => a.localeCompare(b));

      submittedOrders.style.display = "block";

      if (!rows.length) {
        submittedOrders.innerHTML = `
          <h3>Saved Orders</h3>
          <p class="small">No saved order statuses found yet.</p>
        `;
        return;
      }

      submittedOrders.innerHTML = `
        <h3>Saved Orders</h3>
        <p class="small">${escapeHtml(summary)}</p>
        ${shipments.map((shipment, index) => {
          const shipmentRows = groups[shipment];
          const latestUpdate = shipmentRows
            .map(row => row.updated_at)
            .filter(Boolean)
            .sort()
            .pop();

          return `
            <details class="shipment-card" ${index === 0 ? "open" : ""}>
              <summary>
                <span>${escapeHtml(shipment)}</span>
                <span class="shipment-meta">${shipmentRows.length} phones${latestUpdate ? ` | Updated ${escapeHtml(new Date(latestUpdate).toLocaleString())}` : ""}</span>
              </summary>
              <table class="orders-table">
                <thead>
                  <tr>
                    <th>Phone</th>
                    <th>Status</th>
                    <th>Message</th>
                    <th>Updated</th>
                  </tr>
                </thead>
                <tbody>
                  ${shipmentRows.map(row => `
                    <tr>
                      <td>${escapeHtml(row.phone)}</td>
                      <td>${renderStatusBadge(row.status)}</td>
                      <td class="message-cell">${escapeHtml(row.message)}</td>
                      <td class="updated-cell">${row.updated_at ? escapeHtml(new Date(row.updated_at).toLocaleString()) : "-"}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </details>
          `;
        }).join("")}
      `;
    }

    async function loadSavedOrders(summaryText = "") {
      const submittedOrders = document.getElementById("submittedOrders");
      submittedOrders.style.display = "block";
      submittedOrders.innerHTML = `
        <h3>Saved Orders</h3>
        <p class="small">Loading saved order statuses...</p>
      `;

      const { data, error } = await client
        .from("order_statuses")
        .select("phone,status,message,updated_at,shipment_name")
        .order("updated_at", { ascending: false })
        .limit(500);

      if (error) {
        console.log(error);
        submittedOrders.innerHTML = `
          <h3>Saved Orders</h3>
          <p class="small">Could not load saved orders. Please add shipment_name column and check Supabase select policy for logged-in admins.</p>
        `;
        return;
      }

      savedOrders = data || [];
      updateShipmentSelect(savedOrders);
      showSubmittedOrders(savedOrders, summaryText);
    }

    function showAdmin() {
      document.getElementById("adminPanel").style.display = "block";
    }

    async function searchOrder() {
      const phone = cleanPhone(document.getElementById("searchPhone").value);
      const resultBox = document.getElementById("resultBox");

      if (!phone) {
        alert("Please enter phone number");
        return;
      }

      const { data, error } = await client.rpc("search_order_status", {
        search_phone: phone
      });

      resultBox.style.display = "block";

      if (error || !data || data.length === 0) {
        resultBox.innerHTML = `
          <div class="status">No Order Found</div>
          <p>Please check your phone number and try again.</p>
        `;
        return;
      }

      const order = data[0];

      resultBox.innerHTML = `
        <div class="status">${renderStatusBadge(order.status)}</div>
        ${order.shipment_name ? `<p><strong>Shipment:</strong> ${escapeHtml(order.shipment_name)}</p>` : ""}
        <p>${order.message}</p>
        <small>Last updated: ${new Date(order.updated_at).toLocaleString()}</small>
      `;
    }

    async function adminLogin() {
      const username = document.getElementById("adminUsername").value.trim().toLowerCase();
      const password = document.getElementById("adminPassword").value;
      const email = ADMIN_USERS[username];

      if (!email) {
        alert("Unknown admin username");
        return;
      }

      const { error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        console.log(error);
        if (error.message && error.message.includes("Invalid path")) {
          alert("Old cached page loaded. Please hard refresh the page and try again.");
          return;
        }
        alert(error.message || "Wrong admin login");
        return;
      }

      document.getElementById("adminForm").style.display = "block";
      loadSavedOrders();
      alert("Admin logged in");
    }

    async function saveStatus() {
      const phonesText = document.getElementById("bulkPhones").value;
      const shipmentName = document.getElementById("shipmentName").value.trim();
      const status = document.getElementById("status").value;
      const message = document.getElementById("message").value;

      if (!shipmentName) {
        alert("Please add shipment name");
        return;
      }

      if (!message) {
        alert("Please add message");
        return;
      }

      let phones = phonesText
        .split(/\n|,/)
        .map(p => cleanPhone(p))
        .filter(p => p.length > 0);

      if (!phones.length) {
        phones = savedOrders
          .filter(row => getShipmentName(row) === shipmentName)
          .map(row => row.phone);
      }

      if (!phones.length) {
        alert("Please add phone numbers for this new shipment");
        return;
      }

      const rows = phones.map(phone => ({
        phone,
        shipment_name: shipmentName,
        status,
        message,
        updated_at: new Date().toISOString()
      }));

      const { error } = await client
        .from("order_statuses")
        .upsert(rows, { onConflict: "phone" });

      if (error) {
        alert("Error saving data");
        console.log(error);
        return;
      }

      alert("Status updated successfully");
      loadSavedOrders(`Updated ${rows.length} phone number${rows.length === 1 ? "" : "s"} in ${shipmentName}.`);
      document.getElementById("bulkPhones").value = "";
      document.getElementById("message").value = "";
    }
  </script>
</body>
</html>
