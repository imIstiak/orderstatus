<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Tracking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink-950: #4a1029;
      --pink-800: #9d174d;
      --pink-600: #db2777;
      --pink-400: #f472b6;
      --pink-100: #fce7f3;
      --rose-50: #fff1f2;
      --ink: #20111a;
      --muted: #7b6672;
      --card: rgba(255, 255, 255, 0.86);
      --line: rgba(157, 23, 77, 0.16);
      --motion: cubic-bezier(0.32, 0.72, 0, 1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, rgba(244, 114, 182, 0.32), transparent 34%),
        radial-gradient(circle at 90% 0%, rgba(251, 207, 232, 0.82), transparent 36%),
        linear-gradient(135deg, #fff7fb 0%, #fff1f7 42%, #fdf2f8 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(rgba(74, 16, 41, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74, 16, 41, 0.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
    }

    .page {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    .shell {
      padding: 8px;
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.48);
      box-shadow: 0 30px 90px rgba(157, 23, 77, 0.16);
    }

    .panel {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      border: 1px solid var(--line);
      background: var(--card);
      padding: clamp(28px, 6vw, 72px);
    }

    .panel::after {
      content: "";
      position: absolute;
      right: -90px;
      top: -90px;
      width: 260px;
      height: 260px;
      border-radius: 999px;
      background: rgba(244, 114, 182, 0.22);
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 44px;
      align-items: center;
      z-index: 1;
    }

    .eyebrow {
      display: inline-flex;
      width: max-content;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--pink-100);
      color: var(--pink-800);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 20px 0 16px;
      color: var(--pink-950);
      font-size: clamp(42px, 8vw, 86px);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    .lead {
      max-width: 560px;
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.75;
    }

    .tracker {
      padding: 8px;
      border-radius: 28px;
      background: rgba(252, 231, 243, 0.72);
    }

    .tracker-core {
      border-radius: 22px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 22px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: var(--pink-950);
      font-size: 13px;
      font-weight: 800;
    }

    input, button {
      width: 100%;
      border: 0;
      font: inherit;
    }

    input {
      border-radius: 18px;
      background: #fff7fb;
      padding: 17px 18px;
      color: var(--ink);
      outline: 1px solid rgba(157, 23, 77, 0.14);
      transition: outline-color 420ms var(--motion), transform 420ms var(--motion), background 420ms var(--motion);
    }

    input:focus {
      background: #fff;
      outline-color: rgba(219, 39, 119, 0.62);
      transform: translateY(-1px);
    }

    button {
      margin-top: 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--pink-800), var(--pink-600));
      color: #fff;
      padding: 16px 20px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 500ms var(--motion), box-shadow 500ms var(--motion);
      box-shadow: 0 18px 34px rgba(219, 39, 119, 0.24);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 44px rgba(219, 39, 119, 0.3);
    }

    button:active {
      transform: translateY(0) scale(0.99);
    }

    .result {
      display: none;
      margin-top: 18px;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: #fff7fb;
      padding: 18px;
    }

    .status-badge {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .status-processing { background: #dbeafe; color: #1d4ed8; }
    .status-delayed { background: #fee2e2; color: #b91c1c; }
    .status-bd-custom { background: #fef3c7; color: #92400e; }
    .status-delivered { background: #dcfce7; color: #15803d; }
    .status-default { background: #f3f4f6; color: #374151; }

    .message {
      margin: 14px 0 8px;
      color: var(--ink);
      font-weight: 600;
      line-height: 1.6;
    }

    .meta, .history-list {
      color: var(--muted);
      font-size: 13px;
    }

    .history-list {
      margin: 14px 0 0;
      padding-left: 18px;
      line-height: 1.7;
    }

    .feature-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 18px;
    }

    .feature {
      border-radius: 20px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.65);
      padding: 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .feature strong {
      display: block;
      margin-bottom: 5px;
      color: var(--pink-950);
      font-size: 14px;
    }

    @media (max-width: 820px) {
      .page {
        padding: 18px 0;
      }

      .hero {
        grid-template-columns: 1fr;
      }

      .feature-strip {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="shell">
      <div class="panel">
        <div class="hero">
          <div>
            <span class="eyebrow">Live Order Tracking</span>
            <h1>Track your order beautifully.</h1>
            <p class="lead">Enter your phone number and see the latest delivery status, current message, and recent updates in one clear view.</p>
            <div class="feature-strip">
              <div class="feature"><strong>Fast lookup</strong>Search by phone number.</div>
              <div class="feature"><strong>Color status</strong>Instant visual status badges.</div>
              <div class="feature"><strong>Update history</strong>Recent status changes are shown below.</div>
            </div>
          </div>

          <div class="tracker">
            <div class="tracker-core">
              <label for="searchPhone">Phone number</label>
              <input type="text" id="searchPhone" placeholder="017xxxxxxxx" />
              <button onclick="searchOrder()">Check status</button>
              <div class="result" id="resultBox"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://qisjoiwrpeejhjjwgajo.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_nIrPT8RaYL4ZFeuar9jfrw__Qxl3HQ2";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function cleanPhone(phone) {
      return phone.replace(/\D/g, "");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getStatusClass(status) {
      const key = String(status || "").toLowerCase().replace(/\s+/g, "-");
      if (key === "processing") return "status-processing";
      if (key === "delayed") return "status-delayed";
      if (key === "bd-custom") return "status-bd-custom";
      if (key === "delivered") return "status-delivered";
      return "status-default";
    }

    function renderStatusBadge(status) {
      return `<span class="status-badge ${getStatusClass(status)}">${escapeHtml(status)}</span>`;
    }

    async function loadCustomerHistory(phone) {
      const { data, error } = await client
        .from("order_status_history")
        .select("status,message,created_at")
        .eq("phone", phone)
        .order("created_at", { ascending: false })
        .limit(5);

      if (error || !data || !data.length) {
        return "";
      }

      return `
        <ul class="history-list">
          ${data.map(item => `
            <li>
              ${renderStatusBadge(item.status)}
              ${escapeHtml(item.message)}
              <span class="meta">${item.created_at ? escapeHtml(new Date(item.created_at).toLocaleString()) : ""}</span>
            </li>
          `).join("")}
        </ul>
      `;
    }

    async function searchOrder() {
      const phone = cleanPhone(document.getElementById("searchPhone").value);
      const resultBox = document.getElementById("resultBox");

      if (!phone) {
        alert("Please enter phone number");
        return;
      }

      const { data, error } = await client.rpc("search_order_status", {
        search_phone: phone
      });

      resultBox.style.display = "block";

      if (error || !data || data.length === 0) {
        resultBox.innerHTML = `
          ${renderStatusBadge("No Order Found")}
          <p class="message">Please check your phone number and try again.</p>
        `;
        return;
      }

      const order = data[0];
      const historyHtml = await loadCustomerHistory(phone);

      resultBox.innerHTML = `
        ${renderStatusBadge(order.status)}
        <p class="message">${escapeHtml(order.message)}</p>
        <div class="meta">Last updated: ${new Date(order.updated_at).toLocaleString()}</div>
        ${historyHtml}
      `;
    }
  </script>
</body>
</html>
