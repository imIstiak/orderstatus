<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Status</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .container {
      max-width: 650px;
      margin: 80px auto;
      padding: 25px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      color: #6b7280;
    }

    input, textarea, select, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      background: #0f766e;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #115e59;
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      background: #ecfeff;
      display: none;
    }

    .status {
      font-weight: bold;
      color: #0f766e;
      font-size: 20px;
    }

    .admin-link {
      text-align: center;
      margin-top: 40px;
      color: #6b7280;
      cursor: pointer;
      font-size: 14px;
    }

    #adminPanel {
      display: none;
      margin-top: 30px;
      border-top: 1px solid #e5e7eb;
      padding-top: 25px;
    }

    .small {
      font-size: 13px;
      color: #6b7280;
      text-align: left;
    }

    .version {
      margin-top: 10px;
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Check Your Order Status</h1>
    <p>Enter your phone number to see the latest update</p>

    <input type="text" id="searchPhone" placeholder="Enter phone number" />
    <button onclick="searchOrder()">Search</button>

    <div class="result" id="resultBox"></div>

    <div class="admin-link" onclick="showAdmin()">Admin</div>

    <div id="adminPanel">
      <h2>Admin Panel</h2>

      <input type="text" id="adminUsername" placeholder="Admin username" autocomplete="username" />
      <input type="password" id="adminPassword" placeholder="Admin password" />
      <button onclick="adminLogin()">Login</button>
      <div class="version">Admin login v2</div>

      <div id="adminForm" style="display:none;">
        <p class="small">Add phone numbers one per line.</p>

        <textarea id="bulkPhones" rows="7" placeholder="017xxxxxxxx&#10;018xxxxxxxx&#10;019xxxxxxxx"></textarea>

        <select id="status">
          <option value="Processing">Processing</option>
          <option value="Delayed">Delayed</option>
          <option value="BD Custom">BD Custom</option>
          <option value="Delivered">Delivered</option>
        </select>

        <textarea id="message" rows="4" placeholder="Write status message here"></textarea>

        <button onclick="saveStatus()">Submit / Update</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://qisjoiwrpeejhjjwgajo.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_nIrPT8RaYL4ZFeuar9jfrw__Qxl3HQ2";
    const ADMIN_USERS = {
      admin: "admin@order-status.local"
    };
    const APP_VERSION = "admin-login-v2";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    console.log(APP_VERSION);

    function cleanPhone(phone) {
      return phone.replace(/\D/g, "");
    }

    function showAdmin() {
      document.getElementById("adminPanel").style.display = "block";
    }

    async function searchOrder() {
      const phone = cleanPhone(document.getElementById("searchPhone").value);
      const resultBox = document.getElementById("resultBox");

      if (!phone) {
        alert("Please enter phone number");
        return;
      }

      const { data, error } = await client.rpc("search_order_status", {
        search_phone: phone
      });

      resultBox.style.display = "block";

      if (error || !data || data.length === 0) {
        resultBox.innerHTML = `
          <div class="status">No Order Found</div>
          <p>Please check your phone number and try again.</p>
        `;
        return;
      }

      const order = data[0];

      resultBox.innerHTML = `
        <div class="status">${order.status}</div>
        <p>${order.message}</p>
        <small>Last updated: ${new Date(order.updated_at).toLocaleString()}</small>
      `;
    }

    async function adminLogin() {
      const username = document.getElementById("adminUsername").value.trim().toLowerCase();
      const password = document.getElementById("adminPassword").value;
      const email = ADMIN_USERS[username];

      if (!email) {
        alert("Unknown admin username");
        return;
      }

      const { error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        console.log(error);
        if (error.message && error.message.includes("Invalid path")) {
          alert("Old cached page loaded. Please hard refresh the page and try again.");
          return;
        }
        alert(error.message || "Wrong admin login");
        return;
      }

      document.getElementById("adminForm").style.display = "block";
      alert("Admin logged in");
    }

    async function saveStatus() {
      const phonesText = document.getElementById("bulkPhones").value;
      const status = document.getElementById("status").value;
      const message = document.getElementById("message").value;

      if (!phonesText || !message) {
        alert("Please add phone numbers and message");
        return;
      }

      const phones = phonesText
        .split(/\n|,/)
        .map(p => cleanPhone(p))
        .filter(p => p.length > 0);

      const rows = phones.map(phone => ({
        phone,
        status,
        message,
        updated_at: new Date().toISOString()
      }));

      const { error } = await client
        .from("order_statuses")
        .upsert(rows, { onConflict: "phone" });

      if (error) {
        alert("Error saving data");
        console.log(error);
        return;
      }

      alert("Status updated successfully");
      document.getElementById("bulkPhones").value = "";
      document.getElementById("message").value = "";
    }
  </script>
</body>
</html>
