<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Status</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 45%, #fff7ed 100%);
      color: #111827;
    }

    .container {
      max-width: 860px;
      margin: 80px auto;
      padding: 25px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      color: #6b7280;
    }

    input, textarea, select, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      background: #0f766e;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #115e59;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-grid input,
    .form-grid select {
      margin-top: 0;
    }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .secondary-button {
      background: #e5e7eb;
      color: #111827;
    }

    .secondary-button:hover {
      background: #d1d5db;
    }

    .danger-button {
      background: #dc2626;
    }

    .danger-button:hover {
      background: #b91c1c;
    }

    .small-button {
      width: auto;
      margin: 0 6px 6px 0;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      margin: 18px 0;
    }

    .stat-card {
      padding: 12px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
    }

    .stat-value {
      display: block;
      font-size: 24px;
      font-weight: 800;
      color: #0f766e;
    }

    .stat-label {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: #6b7280;
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      background: #ecfeff;
      display: none;
    }

    .status {
      font-weight: bold;
      color: #0f766e;
      font-size: 20px;
    }

    .admin-link {
      text-align: center;
      margin-top: 40px;
      color: #6b7280;
      cursor: pointer;
      font-size: 14px;
    }

    #adminPanel {
      display: none;
      margin-top: 30px;
      border-top: 1px solid #e5e7eb;
      padding-top: 25px;
    }

    .small {
      font-size: 13px;
      color: #6b7280;
      text-align: left;
    }

    .version {
      margin-top: 10px;
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
    }

    .submitted-orders {
      display: none;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #e5e7eb;
    }

    .submitted-orders h3 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .orders-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 14px;
    }

    .orders-table th,
    .orders-table td {
      padding: 10px;
      border: 1px solid #e5e7eb;
      text-align: left;
      vertical-align: top;
    }

    .orders-table th {
      background: #f9fafb;
      color: #374151;
    }

    .shipment-card {
      margin-top: 14px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
      background: #ffffff;
    }

    .shipment-card summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px;
      cursor: pointer;
      background: #f8fafc;
      font-weight: 700;
    }

    .shipment-summary-main {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .shipment-actions {
      padding: 12px 14px 0;
    }

    .shipment-meta {
      color: #6b7280;
      font-size: 13px;
      font-weight: 400;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .status-processing {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status-delayed {
      background: #fee2e2;
      color: #b91c1c;
    }

    .status-bd-custom {
      background: #fef3c7;
      color: #92400e;
    }

    .status-delivered {
      background: #dcfce7;
      color: #15803d;
    }

    .status-default {
      background: #f3f4f6;
      color: #374151;
    }

    .message-cell {
      color: #4b5563;
      line-height: 1.4;
    }

    .updated-cell {
      color: #6b7280;
      white-space: nowrap;
    }

    .history-list {
      margin: 8px 0 0;
      padding-left: 18px;
      color: #4b5563;
      font-size: 13px;
      line-height: 1.5;
    }

    .customer-card {
      border-left: 5px solid #0f766e;
      background: #f8fafc;
    }

    @media (max-width: 720px) {
      .container {
        margin: 24px 12px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .admin-header {
        align-items: stretch;
        flex-direction: column;
      }

      .dashboard {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .orders-table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Check Your Order Status</h1>
    <p>Enter your phone number to see the latest update</p>

    <input type="text" id="searchPhone" placeholder="Enter phone number" />
    <button onclick="searchOrder()">Search</button>

    <div class="result" id="resultBox"></div>

    <div class="admin-link" onclick="showAdmin()">Admin</div>

    <div id="adminPanel">
      <div class="admin-header">
        <h2>Admin Panel</h2>
        <button id="logoutButton" class="secondary-button small-button" style="display:none;" onclick="adminLogout()">Logout</button>
      </div>

      <input type="text" id="adminUsername" placeholder="Admin username" autocomplete="username" />
      <input type="password" id="adminPassword" placeholder="Admin password" />
      <button onclick="adminLogin()">Login</button>
      <div class="version">Admin login v2</div>

      <div id="adminForm" style="display:none;">
        <div id="dashboard" class="dashboard"></div>

        <p class="small">Choose an existing shipment to update all its phones, or type a new shipment name and add phone numbers.</p>

        <div class="form-grid">
          <select id="shipmentSelect" onchange="selectShipment()">
            <option value="">New shipment</option>
          </select>

          <input type="text" id="shipmentName" placeholder="Shipment name" />
        </div>

        <input type="text" id="adminSearch" placeholder="Search shipment, phone, status, or message" oninput="applyAdminFilter()" />

        <textarea id="bulkPhones" rows="7" placeholder="017xxxxxxxx&#10;018xxxxxxxx&#10;019xxxxxxxx"></textarea>

        <div class="form-grid">
          <select id="status">
            <option value="Processing">Processing</option>
            <option value="Delayed">Delayed</option>
            <option value="BD Custom">BD Custom</option>
            <option value="Delivered">Delivered</option>
          </select>

          <select id="messageTemplate" onchange="applyMessageTemplate()">
            <option value="">Message template</option>
            <option value="Your order is processing. We will update again soon.">Processing update</option>
            <option value="Your shipment is delayed. We are following up and will update soon.">Delay update</option>
            <option value="Your shipment is now in BD Custom. Delivery will continue after clearance.">BD Custom update</option>
            <option value="Your order has been delivered. Thank you.">Delivered update</option>
          </select>
        </div>

        <textarea id="message" rows="4" placeholder="Write status message here"></textarea>

        <button onclick="saveStatus()">Submit / Update</button>

        <div id="submittedOrders" class="submitted-orders"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://qisjoiwrpeejhjjwgajo.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_nIrPT8RaYL4ZFeuar9jfrw__Qxl3HQ2";
    const ADMIN_USERS = {
      admin: "admin@order-status.local"
    };
    const APP_VERSION = "shipment-admin-v1";
    let savedOrders = [];
    let savedHistory = [];
    let currentEditPhone = "";

    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    console.log(APP_VERSION);

    function cleanPhone(phone) {
      return phone.replace(/\D/g, "");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeJsString(value) {
      return String(value || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    }

    function getShipmentName(row) {
      return row.shipment_name || "No shipment";
    }

    function getStatusClass(status) {
      const key = String(status || "").toLowerCase().replace(/\s+/g, "-");
      if (key === "processing") return "status-processing";
      if (key === "delayed") return "status-delayed";
      if (key === "bd-custom") return "status-bd-custom";
      if (key === "delivered") return "status-delivered";
      return "status-default";
    }

    function getFilteredOrders() {
      const query = document.getElementById("adminSearch")?.value.trim().toLowerCase() || "";

      if (!query) {
        return savedOrders;
      }

      return savedOrders.filter(row => {
        return [
          row.phone,
          row.status,
          row.message,
          getShipmentName(row)
        ].some(value => String(value || "").toLowerCase().includes(query));
      });
    }

    function getHistoryForPhone(phone) {
      return savedHistory
        .filter(item => item.phone === phone)
        .sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0))
        .slice(0, 5);
    }

    function renderHistoryList(phone) {
      const items = getHistoryForPhone(phone);

      if (!items.length) {
        return "";
      }

      return `
        <ul class="history-list">
          ${items.map(item => `
            <li>
              ${renderStatusBadge(item.status)}
              ${escapeHtml(item.message)}
              <span class="updated-cell">${item.created_at ? escapeHtml(new Date(item.created_at).toLocaleString()) : ""}</span>
            </li>
          `).join("")}
        </ul>
      `;
    }

    function renderStatusBadge(status) {
      return `<span class="status-badge ${getStatusClass(status)}">${escapeHtml(status)}</span>`;
    }

    function groupByShipment(rows) {
      return rows.reduce((groups, row) => {
        const shipment = getShipmentName(row);
        if (!groups[shipment]) groups[shipment] = [];
        groups[shipment].push(row);
        return groups;
      }, {});
    }

    function updateShipmentSelect(rows) {
      const shipmentSelect = document.getElementById("shipmentSelect");
      const currentValue = shipmentSelect.value;
      const shipments = [...new Set(rows.map(getShipmentName))]
        .filter(name => name !== "No shipment")
        .sort((a, b) => a.localeCompare(b));

      shipmentSelect.innerHTML = `
        <option value="">New shipment</option>
        ${shipments.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join("")}
      `;

      if (shipments.includes(currentValue)) {
        shipmentSelect.value = currentValue;
      }
    }

    function selectShipment() {
      const shipmentSelect = document.getElementById("shipmentSelect");
      currentEditPhone = "";
      document.getElementById("shipmentName").value = shipmentSelect.value;
      document.getElementById("bulkPhones").placeholder = shipmentSelect.value
        ? "Leave empty to update all phone numbers in this shipment"
        : "017xxxxxxxx\n018xxxxxxxx\n019xxxxxxxx";
    }

    function applyMessageTemplate() {
      const template = document.getElementById("messageTemplate").value;
      if (template) {
        document.getElementById("message").value = template;
      }
    }

    function applyAdminFilter() {
      showSubmittedOrders(getFilteredOrders());
    }

    function renderDashboard(rows) {
      const dashboard = document.getElementById("dashboard");
      const shipments = new Set(rows.map(getShipmentName).filter(name => name !== "No shipment"));
      const counts = rows.reduce((acc, row) => {
        acc[row.status] = (acc[row.status] || 0) + 1;
        return acc;
      }, {});

      const stats = [
        ["Shipments", shipments.size],
        ["Phones", rows.length],
        ["Processing", counts.Processing || 0],
        ["Delayed", counts.Delayed || 0],
        ["BD Custom", counts["BD Custom"] || 0],
        ["Delivered", counts.Delivered || 0]
      ];

      dashboard.innerHTML = stats.map(([label, value]) => `
        <div class="stat-card">
          <span class="stat-value">${escapeHtml(value)}</span>
          <span class="stat-label">${escapeHtml(label)}</span>
        </div>
      `).join("");
    }

    function showSubmittedOrders(rows, summaryText = "") {
      const submittedOrders = document.getElementById("submittedOrders");
      const summary = summaryText || `Showing ${rows.length} saved order status update${rows.length === 1 ? "" : "s"}.`;
      const groups = groupByShipment(rows);
      const shipments = Object.keys(groups).sort((a, b) => a.localeCompare(b));

      submittedOrders.style.display = "block";

      if (!rows.length) {
        submittedOrders.innerHTML = `
          <h3>Saved Orders</h3>
          <p class="small">No saved order statuses found yet.</p>
        `;
        return;
      }

      submittedOrders.innerHTML = `
        <h3>Saved Orders</h3>
        <p class="small">${escapeHtml(summary)}</p>
        ${shipments.map((shipment, index) => {
          const shipmentRows = groups[shipment];
          const latestUpdate = shipmentRows
            .map(row => row.updated_at)
            .filter(Boolean)
            .sort()
            .pop();

          return `
            <details class="shipment-card" ${index === 0 ? "open" : ""}>
              <summary>
                <span class="shipment-summary-main">
                  <span>${escapeHtml(shipment)}</span>
                  <span>${renderStatusBadge(shipmentRows[0]?.status || "")}</span>
                </span>
                <span class="shipment-meta">${shipmentRows.length} phones${latestUpdate ? ` | Updated ${escapeHtml(new Date(latestUpdate).toLocaleString())}` : ""}</span>
              </summary>
              <div class="shipment-actions">
                <button class="secondary-button small-button" onclick="prepareShipmentUpdate('${escapeJsString(shipment)}')">Update Shipment</button>
                <button class="danger-button small-button" onclick="deleteShipment('${escapeJsString(shipment)}')">Delete Shipment</button>
              </div>
              <table class="orders-table">
                <thead>
                  <tr>
                    <th>Phone</th>
                    <th>Status</th>
                    <th>Message</th>
                    <th>Updated</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${shipmentRows.map(row => `
                    <tr>
                      <td>${escapeHtml(row.phone)}</td>
                      <td>${renderStatusBadge(row.status)}</td>
                      <td class="message-cell">${escapeHtml(row.message)}${renderHistoryList(row.phone)}</td>
                      <td class="updated-cell">${row.updated_at ? escapeHtml(new Date(row.updated_at).toLocaleString()) : "-"}</td>
                      <td>
                        <button class="secondary-button small-button" onclick="editPhone('${escapeJsString(row.phone)}')">Edit</button>
                        <button class="danger-button small-button" onclick="deletePhone('${escapeJsString(row.phone)}')">Delete</button>
                      </td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </details>
          `;
        }).join("")}
      `;
    }

    function prepareShipmentUpdate(shipmentName) {
      document.getElementById("shipmentSelect").value = shipmentName;
      document.getElementById("shipmentName").value = shipmentName;
      document.getElementById("bulkPhones").value = "";
      currentEditPhone = "";
      selectShipment();
      document.getElementById("message").focus();
    }

    function editPhone(phone) {
      const row = savedOrders.find(item => item.phone === phone);

      if (!row) {
        alert("Phone not found");
        return;
      }

      currentEditPhone = phone;
      document.getElementById("shipmentName").value = getShipmentName(row) === "No shipment" ? "" : getShipmentName(row);
      document.getElementById("shipmentSelect").value = getShipmentName(row) === "No shipment" ? "" : getShipmentName(row);
      document.getElementById("bulkPhones").value = phone;
      document.getElementById("status").value = row.status;
      document.getElementById("message").value = row.message;
      document.getElementById("message").focus();
    }

    async function loadStatusHistory() {
      const { data, error } = await client
        .from("order_status_history")
        .select("phone,shipment_name,status,message,created_at")
        .order("created_at", { ascending: false })
        .limit(1000);

      if (error) {
        console.log(error);
        savedHistory = [];
        return;
      }

      savedHistory = data || [];
    }

    async function addStatusHistory(rows) {
      const historyRows = rows.map(row => ({
        phone: row.phone,
        shipment_name: row.shipment_name,
        status: row.status,
        message: row.message
      }));

      const { error } = await client
        .from("order_status_history")
        .insert(historyRows);

      if (error) {
        console.log(error);
      }
    }

    async function deletePhone(phone) {
      if (!confirm(`Delete ${phone}?`)) {
        return;
      }

      const { error } = await client
        .from("order_statuses")
        .delete()
        .eq("phone", phone);

      if (error) {
        console.log(error);
        alert("Could not delete phone");
        return;
      }

      await loadSavedOrders(`Deleted ${phone}.`);
    }

    async function deleteShipment(shipmentName) {
      if (!confirm(`Delete all phones in ${shipmentName}?`)) {
        return;
      }

      const { error } = await client
        .from("order_statuses")
        .delete()
        .eq("shipment_name", shipmentName);

      if (error) {
        console.log(error);
        alert("Could not delete shipment");
        return;
      }

      document.getElementById("shipmentName").value = "";
      document.getElementById("shipmentSelect").value = "";
      await loadSavedOrders(`Deleted shipment ${shipmentName}.`);
    }

    async function loadCustomerHistory(phone) {
      const { data, error } = await client
        .from("order_status_history")
        .select("status,message,created_at")
        .eq("phone", phone)
        .order("created_at", { ascending: false })
        .limit(5);

      if (error || !data || !data.length) {
        return "";
      }

      return `
        <h3>Status History</h3>
        <ul class="history-list">
          ${data.map(item => `
            <li>
              ${renderStatusBadge(item.status)}
              ${escapeHtml(item.message)}
              <span class="updated-cell">${item.created_at ? escapeHtml(new Date(item.created_at).toLocaleString()) : ""}</span>
            </li>
          `).join("")}
        </ul>
      `;
    }

    async function loadSavedOrders(summaryText = "") {
      const submittedOrders = document.getElementById("submittedOrders");
      submittedOrders.style.display = "block";
      submittedOrders.innerHTML = `
        <h3>Saved Orders</h3>
        <p class="small">Loading saved order statuses...</p>
      `;

      await loadStatusHistory();

      const { data, error } = await client
        .from("order_statuses")
        .select("phone,status,message,updated_at,shipment_name")
        .order("updated_at", { ascending: false })
        .limit(500);

      if (error) {
        console.log(error);
        submittedOrders.innerHTML = `
          <h3>Saved Orders</h3>
          <p class="small">Could not load saved orders. Please add shipment_name column and check Supabase select policy for logged-in admins.</p>
        `;
        return;
      }

      savedOrders = data || [];
      updateShipmentSelect(savedOrders);
      renderDashboard(savedOrders);
      showSubmittedOrders(savedOrders, summaryText);
    }

    function showAdmin() {
      document.getElementById("adminPanel").style.display = "block";
    }

    function showLoggedInAdmin() {
      document.getElementById("adminPanel").style.display = "block";
      document.getElementById("adminForm").style.display = "block";
      document.getElementById("logoutButton").style.display = "inline-block";
      loadSavedOrders();
    }

    async function adminLogout() {
      await client.auth.signOut();
      document.getElementById("adminForm").style.display = "none";
      document.getElementById("logoutButton").style.display = "none";
      document.getElementById("adminPassword").value = "";
      alert("Logged out");
    }

    async function searchOrder() {
      const phone = cleanPhone(document.getElementById("searchPhone").value);
      const resultBox = document.getElementById("resultBox");

      if (!phone) {
        alert("Please enter phone number");
        return;
      }

      const { data, error } = await client.rpc("search_order_status", {
        search_phone: phone
      });

      resultBox.style.display = "block";
      resultBox.classList.remove("customer-card");

      if (error || !data || data.length === 0) {
        resultBox.innerHTML = `
          <div class="status">No Order Found</div>
          <p>Please check your phone number and try again.</p>
        `;
        return;
      }

      const order = data[0];
      const historyHtml = await loadCustomerHistory(phone);

      resultBox.classList.add("customer-card");
      resultBox.innerHTML = `
        <div class="status">${renderStatusBadge(order.status)}</div>
        <p>${escapeHtml(order.message)}</p>
        <small>Last updated: ${new Date(order.updated_at).toLocaleString()}</small>
        ${historyHtml}
      `;
    }

    async function adminLogin() {
      const username = document.getElementById("adminUsername").value.trim().toLowerCase();
      const password = document.getElementById("adminPassword").value;
      const email = ADMIN_USERS[username];

      if (!email) {
        alert("Unknown admin username");
        return;
      }

      const { error } = await client.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        console.log(error);
        if (error.message && error.message.includes("Invalid path")) {
          alert("Old cached page loaded. Please hard refresh the page and try again.");
          return;
        }
        alert(error.message || "Wrong admin login");
        return;
      }

      document.getElementById("adminForm").style.display = "block";
      document.getElementById("logoutButton").style.display = "inline-block";
      loadSavedOrders();
      alert("Admin logged in");
    }

    async function saveStatus() {
      const phonesText = document.getElementById("bulkPhones").value;
      const shipmentName = document.getElementById("shipmentName").value.trim();
      const status = document.getElementById("status").value;
      const message = document.getElementById("message").value;

      if (!shipmentName) {
        alert("Please add shipment name");
        return;
      }

      if (!message) {
        alert("Please add message");
        return;
      }

      let phones = phonesText
        .split(/\n|,/)
        .map(p => cleanPhone(p))
        .filter(p => p.length > 0);

      if (!phones.length) {
        phones = savedOrders
          .filter(row => getShipmentName(row) === shipmentName)
          .map(row => row.phone);
      }

      if (!phones.length) {
        alert("Please add phone numbers for this new shipment");
        return;
      }

      const rows = phones.map(phone => ({
        phone,
        shipment_name: shipmentName,
        status,
        message,
        updated_at: new Date().toISOString()
      }));

      const { error } = await client
        .from("order_statuses")
        .upsert(rows, { onConflict: "phone" });

      if (error) {
        alert("Error saving data");
        console.log(error);
        return;
      }

      await addStatusHistory(rows);
      currentEditPhone = "";
      alert("Status updated successfully");
      loadSavedOrders(`Updated ${rows.length} phone number${rows.length === 1 ? "" : "s"} in ${shipmentName}.`);
      document.getElementById("bulkPhones").value = "";
      document.getElementById("message").value = "";
    }

    client.auth.getSession().then(({ data }) => {
      if (data.session) {
        showLoggedInAdmin();
      }
    });
  </script>
</body>
</html>
