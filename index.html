<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Tracking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/index.css">
</head>
<body class="tracking-page">
  <main class="page">
    <section class="tracking-card">
      <span class="eyebrow">Order Tracking</span>
      <h1>Track Your Order</h1>
      <p class="lead">Enter your phone number to check your latest order status.</p>

      <div class="search-box">
        <input type="text" id="searchPhone" placeholder="Enter phone number" />
        <button onclick="searchOrder()">Search</button>
      </div>

      <div class="result" id="resultBox"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://qisjoiwrpeejhjjwgajo.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_nIrPT8RaYL4ZFeuar9jfrw__Qxl3HQ2";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function cleanPhone(phone) {
      return phone.replace(/\D/g, "");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getStatusClass(status) {
      const key = String(status || "").toLowerCase().replace(/\s+/g, "-");
      if (key === "processing" || key === "processing-in-china") return "status-processing";
      if (key === "shipped-from-china") return "status-shipped";
      if (key === "arrived-in-bangladesh") return "status-bangladesh";
      if (key === "ready-for-delivery") return "status-ready";
      if (key === "delayed") return "status-delayed";
      if (key === "bd-custom") return "status-bd-custom";
      if (key === "delivered") return "status-delivered";
      return "status-default";
    }

    function renderStatusBadge(status) {
      return `<span class="status-badge ${getStatusClass(status)}">${escapeHtml(status)}</span>`;
    }

    function getTrackingSteps(status, message) {
      const normalizedStatus = String(status || "").toLowerCase();
      const steps = [
        {
          key: "confirmed",
          title: "Order Confirmed",
          text: "Your order has been received successfully."
        },
        {
          key: "payment",
          title: "Payment Confirmed",
          text: "Your payment has been verified."
        },
        {
          key: "processing",
          title: normalizedStatus === "delayed" ? "Delayed" : "Processing in China",
          text: normalizedStatus === "delayed"
            ? message || "Your shipment is delayed. We will update you soon."
            : "Your order is being prepared for shipment."
        },
        {
          key: "shipped",
          title: "Shipped from China",
          text: "Your parcel has left China and is on the way."
        },
        {
          key: "bangladesh",
          title: "Arrived in Bangladesh",
          text: "Your parcel has arrived in Bangladesh and is waiting for the next update."
        },
        {
          key: "ready",
          title: "Ready for Delivery",
          text: "Our delivery team will contact you soon."
        },
        {
          key: "delivered",
          title: "Delivered",
          text: "Your order has been delivered successfully."
        }
      ];

      let currentIndex = 2;

      if (normalizedStatus.includes("ship")) {
        currentIndex = 3;
      }

      if (normalizedStatus.includes("custom") || normalizedStatus.includes("bangladesh")) {
        currentIndex = 4;
      }

      if (normalizedStatus.includes("ready")) {
        currentIndex = 5;
      }

      if (normalizedStatus === "delivered" || normalizedStatus.includes("delivered")) {
        currentIndex = 6;
      }

      if (message) {
        steps[currentIndex].text = message;
      }

      return steps.map((step, index) => ({
        ...step,
        number: index + 1,
        colorClass: getStatusClass(step.title),
        state: index < currentIndex ? "done" : index === currentIndex ? "current" : "upcoming"
      }));
    }

    function getCurrentTitle(status) {
      const normalizedStatus = String(status || "").toLowerCase();

      if (normalizedStatus.includes("ready")) {
        return "Ready for Delivery";
      }

      if (normalizedStatus === "delivered" || normalizedStatus.includes("delivered")) {
        return "Delivered";
      }

      if (normalizedStatus.includes("custom") || normalizedStatus.includes("bangladesh")) {
        return "Arrived in Bangladesh";
      }

      if (normalizedStatus.includes("ship")) {
        return "Shipped from China";
      }

      if (normalizedStatus === "delayed") {
        return "Delayed";
      }

      return "Processing in China";
    }

    function renderTimeline(status, message) {
      return `
        <div class="timeline">
          ${getTrackingSteps(status, message).map(step => `
            <div class="timeline-row ${step.state} ${step.colorClass}">
              <div class="timeline-marker">${step.state === "done" ? "&#10003;" : step.number}</div>
              <div class="timeline-content">
                <h3>${escapeHtml(step.title)}</h3>
                <p>${escapeHtml(step.text)}</p>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    async function findOrderByPhone(phone) {
      if (phone.length >= 7) {
        const exactResult = await client.rpc("search_order_status", {
          search_phone: phone
        });

        if (!exactResult.error && exactResult.data && exactResult.data.length > 0) {
          return { order: exactResult.data[0], multiple: false, error: null };
        }
      }

      if (phone.length >= 4) {
        const { data, error } = await client
          .from("order_statuses")
          .select("phone,status,message,updated_at")
          .like("phone", `%${phone}`)
          .order("updated_at", { ascending: false })
          .limit(2);

        if (error) {
          return { order: null, multiple: false, error };
        }

        if (data && data.length === 1) {
          return { order: data[0], multiple: false, error: null };
        }

        if (data && data.length > 1) {
          return { order: null, multiple: true, error: null };
        }
      }

      return { order: null, multiple: false, error: null };
    }

    async function searchOrder() {
      const phone = cleanPhone(document.getElementById("searchPhone").value);
      const resultBox = document.getElementById("resultBox");

      if (!phone) {
        alert("Please enter phone number");
        return;
      }

      const { order, multiple, error } = await findOrderByPhone(phone);

      resultBox.style.display = "block";

      if (multiple) {
        resultBox.innerHTML = `
          ${renderStatusBadge("Multiple Matches")}
          <p class="message">Please enter more digits of your phone number.</p>
        `;
        return;
      }

      if (error || !order) {
        resultBox.innerHTML = `
          ${renderStatusBadge("No Order Found")}
          <p class="message">Please check your phone number and try again.</p>
        `;
        return;
      }

      resultBox.innerHTML = `
        <div class="current-status ${getStatusClass(getCurrentTitle(order.status))}">
          <span>Current Status</span>
          <strong>${escapeHtml(getCurrentTitle(order.status))}</strong>
        </div>
        ${renderTimeline(order.status, order.message)}
        <div class="meta result-meta">Last updated: ${new Date(order.updated_at).toLocaleString()}</div>
      `;
    }
  </script>
</body>
</html>
