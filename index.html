<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Tracking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/index.css">
</head>
<body class="tracking-page">
  <main class="page">
    <section class="tracking-card">
      <span class="eyebrow">Order Tracking</span>
      <h1>Track Your Order</h1>
      <p class="lead">Enter your phone number to check your latest order status.</p>

      <div class="search-box">
        <input type="text" id="searchPhone" placeholder="Enter phone number" />
        <button onclick="searchOrder()">Search</button>
      </div>

      <div class="result" id="resultBox"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://qisjoiwrpeejhjjwgajo.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_nIrPT8RaYL4ZFeuar9jfrw__Qxl3HQ2";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function cleanPhone(phone) {
      return phone.replace(/\D/g, "");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getStatusClass(status) {
      const key = String(status || "").toLowerCase().replace(/\s+/g, "-");
      if (key === "processing") return "status-processing";
      if (key === "delayed") return "status-delayed";
      if (key === "bd-custom") return "status-bd-custom";
      if (key === "delivered") return "status-delivered";
      return "status-default";
    }

    function renderStatusBadge(status) {
      return `<span class="status-badge ${getStatusClass(status)}">${escapeHtml(status)}</span>`;
    }

    async function loadCustomerHistory(phone) {
      const { data, error } = await client
        .from("order_status_history")
        .select("status,message,created_at")
        .eq("phone", phone)
        .order("created_at", { ascending: false })
        .limit(5);

      if (error || !data || !data.length) {
        return "";
      }

      return `
        <ul class="history-list">
          ${data.map(item => `
            <li>
              ${renderStatusBadge(item.status)}
              ${escapeHtml(item.message)}
              <span class="meta">${item.created_at ? escapeHtml(new Date(item.created_at).toLocaleString()) : ""}</span>
            </li>
          `).join("")}
        </ul>
      `;
    }

    async function searchOrder() {
      const phone = cleanPhone(document.getElementById("searchPhone").value);
      const resultBox = document.getElementById("resultBox");

      if (!phone) {
        alert("Please enter phone number");
        return;
      }

      const { data, error } = await client.rpc("search_order_status", {
        search_phone: phone
      });

      resultBox.style.display = "block";

      if (error || !data || data.length === 0) {
        resultBox.innerHTML = `
          ${renderStatusBadge("No Order Found")}
          <p class="message">Please check your phone number and try again.</p>
        `;
        return;
      }

      const order = data[0];
      const historyHtml = await loadCustomerHistory(phone);

      resultBox.innerHTML = `
        ${renderStatusBadge(order.status)}
        <p class="message">${escapeHtml(order.message)}</p>
        <div class="meta">Last updated: ${new Date(order.updated_at).toLocaleString()}</div>
        ${historyHtml}
      `;
    }
  </script>
</body>
</html>
